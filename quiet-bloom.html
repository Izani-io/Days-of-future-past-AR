<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <script>

    AFRAME.registerShader('rose-chroma', {

      schema: {
        src: { type: 'map', is: 'uniform' }
      },


      vertexShader: `

        varying vec2 vUv;

        void main() {

          vUv = uv;

          gl_Position =
            projectionMatrix *
            modelViewMatrix *
            vec4(position, 1.0);

        }

      `,


      fragmentShader: `

        precision mediump float;

        uniform sampler2D src;

        varying vec2 vUv;


        void main() {

          vec4 color = texture2D(src, vUv);


          float brightness =
            max(
              color.r,
              max(color.g, color.b)
            );


          /*
           * Remove the dark/black
           * background of the rose video.
           */

          float alpha = smoothstep(
            0.04,
            0.18,
            brightness
          );


          /*
           * Completely remove
           * extremely dark pixels.
           */

          if (brightness < 0.04) {
            discard;
          }


          gl_FragColor = vec4(
            color.rgb,
            alpha
          );

        }

      `

    });

  </script>

</head>


<body>


  <a-scene

    mindar-image="imageTargetSrc: ./quiet-bloom.mind;"

    color-space="sRGB"

    renderer="colorManagement: true, physicallyCorrectLights"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">


    <a-assets>


      <video

        id="roseVideo"

        src="./quiet-bloom.mp4"

        loop

        muted

        playsinline

        webkit-playsinline

        crossorigin="anonymous">

      </video>


    </a-assets>


    <a-camera

      position="0 0 0"

      look-controls="enabled: false">

    </a-camera>


    <a-entity

      mindar-image-target="targetIndex: 0">


      <a-entity

        geometry="primitive: plane; width: 0.45; height: 0.45"

        material="shader: rose-chroma; src: #roseVideo; transparent: true; side: front; depthWrite: false"

        position="0.04 -0.06 0.01">

      </a-entity>


    </a-entity>


  </a-scene>


  <script>


    const target =
      document.querySelector(
        '[mindar-image-target]'
      );


    const video =
      document.querySelector(
        '#roseVideo'
      );


    target.addEventListener(

      'targetFound',

      () => {

        video.currentTime = 0;

        video.play().catch(error => {

          console.log(
            'Video play failed:',
            error
          );

        });

      }

    );


    target.addEventListener(

      'targetLost',

      () => {

        video.pause();

      }

    );


    document.addEventListener(

      'touchstart',

      () => {

        video.play().catch(() => {});

      },

      { once: true }

    );


    document.addEventListener(

      'click',

      () => {

        video.play().catch(() => {});

      },

      { once: true }

    );


  </script>


</body>

</html>
