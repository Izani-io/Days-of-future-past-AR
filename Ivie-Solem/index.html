<!DOCTYPE html>
<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
  AFRAME.registerShader('effect-chroma', {
    schema: {
      src: { type: 'map', is: 'uniform' }
    },

    vertexShader: `
      varying vec2 vUv;

      void main() {
        vUv = uv;

        gl_Position =
          projectionMatrix *
          modelViewMatrix *
          vec4(position, 1.0);
      }
    `,

    fragmentShader: `
      precision mediump float;

      uniform sampler2D src;
      varying vec2 vUv;

      void main() {

        vec4 color = texture2D(src, vUv);

        float brightness =
          max(color.r, max(color.g, color.b));

        float alpha = smoothstep(
          0.02,
          0.08,
          brightness
        );

        if (brightness < 0.02) {
          discard;
        }

        gl_FragColor = vec4(color.rgb, alpha);
      }
    `
  });
</script>


  <!-- SOUND BUTTON STYLE -->

  <style>

    #soundButton {

      position: fixed;

      left: 50%;
      bottom: 30px;

      transform: translateX(-50%);

      z-index: 9999;

      padding: 14px 24px;

      border: none;
      border-radius: 30px;

      background: rgba(0, 0, 0, 0.85);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 16px;

      cursor: pointer;

      box-shadow: 0 4px 15px rgba(0,0,0,0.3);

    }

  </style>

</head>


<body>


  <!-- ===================================================== -->
  <!-- SOUND ENABLE BUTTON                                   -->
  <!-- ===================================================== -->

  <button id="soundButton">
    🔊 Tap to enable sound
  </button>



  <!-- ===================================================== -->
  <!-- AR SCENE                                               -->
  <!-- ===================================================== -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./collection.mind;
      filterMinCF: 0.0001;
      filterBeta: 1000;
      warmupTolerance: 5;
      missTolerance: 5;
    "

    color-space="sRGB"

    renderer="colorManagement: true"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">


    <!-- =================================================== -->
    <!-- VIDEOS                                               -->
    <!-- =================================================== -->

    <a-assets>

      <video
        id="ivieVideo"
        src="./ivie-effect.mp4"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>


      <video
        id="solemVideo"
        src="./solem-effect.mp4"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

    </a-assets>



    <!-- =================================================== -->
    <!-- CAMERA                                               -->
    <!-- =================================================== -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>



    <!-- =================================================== -->
    <!-- IVIE                                                 -->
    <!-- TARGET 0                                             -->
    <!-- 4:5                                                  -->
    <!-- =================================================== -->

    <a-entity
      id="target-ivie"
      mindar-image-target="targetIndex: 0">

      <a-entity

        geometry="
          primitive: plane;
          width: 1;
          height: 1.25
        "

        material="
          shader: effect-chroma;
          src: #ivieVideo;
          transparent: true;
          side: front;
          depthWrite: false
        "

        position="0 0 0.01">

      </a-entity>

    </a-entity>



    <!-- =================================================== -->
    <!-- SOLEM                                                -->
    <!-- TARGET 1                                             -->
    <!-- 4:5                                                  -->
    <!-- =================================================== -->

    <a-entity
      id="target-solem"
      mindar-image-target="targetIndex: 1">

      <a-entity

        geometry="
          primitive: plane;
          width: 1;
          height: 1.25
        "

        material="
          shader: effect-chroma;
          src: #solemVideo;
          transparent: true;
          side: front;
          depthWrite: false
        "

        position="0 0 0.01">

      </a-entity>

    </a-entity>


  </a-scene>



  <!-- ===================================================== -->
  <!-- VIDEO CONTROL                                         -->
  <!-- ===================================================== -->

  <script>

    const ivieVideo =
      document.querySelector('#ivieVideo');

    const solemVideo =
      document.querySelector('#solemVideo');

    const soundButton =
      document.querySelector('#soundButton');


    let soundUnlocked = false;


    const targets = [

      {
        target: document.querySelector('#target-ivie'),
        video: ivieVideo
      },

      {
        target: document.querySelector('#target-solem'),
        video: solemVideo
      }

    ];



    /* =====================================================
       ENABLE AUDIO
       ===================================================== */

    soundButton.addEventListener('click', async () => {

      try {

        /*
         * This play() happens DIRECTLY because
         * the visitor pressed the button.
         */

        ivieVideo.volume = 1;
        solemVideo.volume = 1;

        await ivieVideo.play();

        ivieVideo.pause();
        ivieVideo.currentTime = 0;


        await solemVideo.play();

        solemVideo.pause();
        solemVideo.currentTime = 0;


        soundUnlocked = true;

        soundButton.innerText = '✓ Sound enabled';

        setTimeout(() => {

          soundButton.style.display = 'none';

        }, 1000);

      }

      catch (error) {

        console.log(
          'Audio unlock failed:',
          error
        );

      }

    });



    /* =====================================================
       TARGET DETECTION
       ===================================================== */

    targets.forEach(({ target, video }) => {


      target.addEventListener(
        'targetFound',
        () => {

          /*
           * Stop the other artwork.
           */

          targets.forEach(item => {

            if (item.video !== video) {

              item.video.pause();

            }

          });


          /*
           * Start detected artwork.
           */

          video.currentTime = 0;

          video.volume = 1;


          video.play().catch(error => {

            console.log(
              'Video/audio playback failed:',
              error
            );

          });

        }
      );


      target.addEventListener(
        'targetLost',
        () => {

          video.pause();

        }
      );

    });

  </script>


</body>
</html>
