<!DOCTYPE html>
<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <!-- ===================================================== -->
  <!-- CHROMA / TRANSPARENCY SHADER                          -->
  <!-- ===================================================== -->

  <script>

    AFRAME.registerShader('effect-chroma', {

      schema: {
        src: { type: 'map', is: 'uniform' }
      },

      vertexShader: `
        varying vec2 vUv;

        void main() {
          vUv = uv;

          gl_Position =
            projectionMatrix *
            modelViewMatrix *
            vec4(position, 1.0);
        }
      `,

      fragmentShader: `
        precision mediump float;

        uniform sampler2D src;
        varying vec2 vUv;

        void main() {

          vec4 color = texture2D(src, vUv);

          float brightness =
            max(color.r, max(color.g, color.b));

          float alpha = smoothstep(
            0.10,
            0.30,
            brightness
          );

          if (brightness < 0.10) {
            discard;
          }

          gl_FragColor = vec4(color.rgb, alpha);
        }
      `
    });

  </script>

</head>


<body>

  <!-- ===================================================== -->
  <!-- AR SCENE                                               -->
  <!-- ===================================================== -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./collection.mind;
      filterMinCF: 0.0001;
      filterBeta: 1000;
      warmupTolerance: 5;
      missTolerance: 5;
    "

    color-space="sRGB"

    renderer="colorManagement: true"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">


    <!-- =================================================== -->
    <!-- VIDEO ASSETS                                         -->
    <!-- =================================================== -->

    <a-assets>

      <!-- IVIE -->

      <video
        id="ivieVideo"
        src="./ivie-effect.mp4"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>


      <!-- SOLEM -->

      <video
        id="solemVideo"
        src="./solem-effect.mp4"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

    </a-assets>


    <!-- =================================================== -->
    <!-- CAMERA                                               -->
    <!-- =================================================== -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- =================================================== -->
    <!-- 1. IVIE                                              -->
    <!-- TARGET 0                                             -->
    <!-- ARTWORK: 16 × 20 INCHES / 4:5                       -->
    <!-- =================================================== -->

    <a-entity
      id="target-ivie"
      mindar-image-target="targetIndex: 0">

      <a-entity

        geometry="
          primitive: plane;
          width: 1;
          height: 1.25
        "

        material="
          shader: effect-chroma;
          src: #ivieVideo;
          transparent: true;
          side: front;
          depthWrite: false
        "

        position="0 0 0.01">

      </a-entity>

    </a-entity>


    <!-- =================================================== -->
    <!-- 2. SOLEM                                             -->
    <!-- TARGET 1                                             -->
    <!-- ARTWORK: 16 × 20 INCHES / 4:5                       -->
    <!-- =================================================== -->

    <a-entity
      id="target-solem"
      mindar-image-target="targetIndex: 1">

      <a-entity

        geometry="
          primitive: plane;
          width: 1;
          height: 1.25
        "

        material="
          shader: effect-chroma;
          src: #solemVideo;
          transparent: true;
          side: front;
          depthWrite: false
        "

        position="0 0 0.01">

      </a-entity>

    </a-entity>


  </a-scene>


  <!-- ===================================================== -->
  <!-- VIDEO / TARGET CONTROL                                -->
  <!-- ===================================================== -->

  <script>

    const targets = [

      {
        target: document.querySelector('#target-ivie'),
        video: document.querySelector('#ivieVideo')
      },

      {
        target: document.querySelector('#target-solem'),
        video: document.querySelector('#solemVideo')
      }

    ];


    /* =====================================================
       TARGET FOUND / LOST
       ===================================================== */

    targets.forEach(({ target, video }) => {

      target.addEventListener('targetFound', () => {

        /*
         * Pause every other artwork's video.
         * Only the currently detected artwork plays.
         */

        targets.forEach(item => {

          if (item.video !== video) {
            item.video.pause();
          }

        });


        /*
         * Start the detected artwork
         * from the beginning.
         */

        video.currentTime = 0;

        video.play().catch(error => {

          console.log(
            'Video play failed:',
            error
          );

        });

      });


      target.addEventListener('targetLost', () => {

        video.pause();

      });

    });


    /* =====================================================
       MOBILE VIDEO PLAYBACK UNLOCK
       ===================================================== */

    const unlockVideos = () => {

      targets.forEach(({ video }) => {

        video.play()

          .then(() => {

            video.pause();

            video.currentTime = 0;

          })

          .catch(() => {});

      });

    };


    document.addEventListener(
      'touchstart',
      unlockVideos,
      { once: true }
    );


    document.addEventListener(
      'click',
      unlockVideos,
      { once: true }
    );

  </script>


</body>
</html>
