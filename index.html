<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #fireCanvas {
      display: none;
    }
  </style>
</head>

<body>

  <!-- Hidden video -->
  <video
    id="fireVideo"
    src="./fire-ar.mp4"
    loop
    muted
    playsinline
    webkit-playsinline
    crossorigin="anonymous"
    style="display:none;">
  </video>

  <!-- Transparent processed video -->
  <canvas
    id="fireCanvas"
    width="1280"
    height="720">
  </canvas>

  <a-scene
    mindar-image="imageTargetSrc: ./what-the-fire-left.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-plane
        id="firePlane"
        position="0 -0.25 0"
        width="1"
        height="0.5625"
        material="src: #fireCanvas; transparent: true; alphaTest: 0.01; side: double;">
      </a-plane>

    </a-entity>

  </a-scene>


  <script>

    const video = document.getElementById("fireVideo");
    const canvas = document.getElementById("fireCanvas");
    const ctx = canvas.getContext("2d", {
      willReadFrequently: true
    });

    const target = document.querySelector(
      '[mindar-image-target]'
    );

    let processing = false;


    /*
     * Remove the black background from every video frame.
     */
    function processFire() {

      if (!processing) return;

      if (video.readyState >= 2) {

        ctx.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const imageData = ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

        const pixels = imageData.data;

        for (let i = 0; i < pixels.length; i += 4) {

          const r = pixels[i];
          const g = pixels[i + 1];
          const b = pixels[i + 2];

          /*
           * Brightness of the pixel.
           */
          const brightness =
            Math.max(r, g, b);

          /*
           * Make black/dark pixels transparent.
           *
           * Pure black = completely transparent.
           * Fire colours = remain visible.
           */
          if (brightness < 35) {

            pixels[i + 3] = 0;

          } else if (brightness < 70) {

            /*
             * Smooth transition around
             * the edge of the fire.
             */
            pixels[i + 3] =
              Math.round(
                ((brightness - 35) / 35) * 255
              );

          } else {

            pixels[i + 3] = 255;

          }
        }

        ctx.putImageData(
          imageData,
          0,
          0
        );
      }

      requestAnimationFrame(processFire);
    }


    /*
     * Start processing when the artwork
     * is detected.
     */
    target.addEventListener(
      "targetFound",
      () => {

        processing = true;

        video.currentTime = 0;

        video.play().catch(error => {
          console.log(
            "Video play failed:",
            error
          );
        });

        processFire();
      }
    );


    /*
     * Stop when artwork is lost.
     */
    target.addEventListener(
      "targetLost",
      () => {

        processing = false;

        video.pause();
      }
    );


    /*
     * Mobile browser fallback.
     */
    document.addEventListener(
      "touchstart",
      () => {

        video.play().catch(() => {});

      },
      { once: true }
    );


    document.addEventListener(
      "click",
      () => {

        video.play().catch(() => {});

      },
      { once: true }
    );

  </script>

</body>
</html>
