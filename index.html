<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    AFRAME.registerShader('fire-chroma', {
      schema: {
        src: { type: 'map', is: 'uniform' }
      },

      init: function () {
        this.material = new THREE.ShaderMaterial({
          uniforms: {
            src: {
              value: null
            }
          },

          vertexShader: `
            varying vec2 vUv;

            void main() {
              vUv = uv;

              gl_Position =
                projectionMatrix *
                modelViewMatrix *
                vec4(position, 1.0);
            }
          `,

          fragmentShader: `
            uniform sampler2D src;
            varying vec2 vUv;

            void main() {

              vec4 color = texture2D(src, vUv);

              float brightness =
                max(color.r, max(color.g, color.b));

              /*
               * Make the dark/black background transparent.
               * Bright fire remains visible.
               */
              float alpha = smoothstep(
                0.04,
                0.18,
                brightness
              );

              /*
               * Slightly reduce dark grey edges
               * while keeping the fire.
               */
              if (brightness < 0.025) {
                discard;
              }

              gl_FragColor = vec4(
                color.rgb,
                color.a * alpha
              );
            }
          `,

          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false
        });
      },

      update: function (data) {
        if (data.src) {
          this.material.uniforms.src.value = data.src;
        }
      }
    });
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./what-the-fire-left.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>

      <video
        id="fireVideo"
        src="./fire-ar.mp4"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-video
        src="#fireVideo"
        position="0 -0.25 0"
        width="1"
        height="0.5625"
        material="shader: fire-chroma;">
      </a-video>

    </a-entity>

  </a-scene>

  <script>

    const target = document.querySelector(
      '[mindar-image-target]'
    );

    const video = document.querySelector(
      '#fireVideo'
    );

    // Start the fire when the artwork is detected
    target.addEventListener('targetFound', () => {

      video.currentTime = 0;

      video.play().catch(error => {
        console.log(
          'Video play failed:',
          error
        );
      });

    });

    // Pause when artwork leaves the camera
    target.addEventListener('targetLost', () => {

      video.pause();

    });

    // Mobile browser fallback
    document.addEventListener('touchstart', () => {

      video.play().catch(error => {
        console.log(
          'Touch play failed:',
          error
        );
      });

    }, { once: true });

    document.addEventListener('click', () => {

      video.play().catch(error => {
        console.log(
          'Click play failed:',
          error
        );
      });

    }, { once: true });

  </script>

</body>
</html>
